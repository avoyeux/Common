[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "2.0.0"
authors = [
  { name = "Voyeux Alfred", email = "voyeuxalfred@gmail.com" }
]
description = "Some functions that I use a lot."
readme = "README.md"
requires-python = ">=3.12.3"
license = "MIT"

dependencies = [
  "astropy>=8.0.1",
  "astropy-iers-data>=0.2026.8.3.0.53.6",
  "contourpy>=1.3.3",
  "cycler>=0.12.1",
  "fonttools>=4.63.0",
  "h5py>=3.16.0",
  "kiwisolver>=1.5.0",
  "matplotlib>=3.11.1",
  "numpy>=2.5.1",
  "packaging>=26.3",
  "pandas>=3.0.5",
  "pillow>=12.3.0",
  "pyerfa>=2.0.1.5",
  "pyparsing>=3.3.2",
  "python-dateutil>=2.9.0.post0",
  "PyYAML>=6.0.3",
  "scipy>=1.18.0",
  "six>=1.17.0",
]

[tool.setuptools]
packages = ["common"]

[tool.setuptools.package-dir]
common = "src"
